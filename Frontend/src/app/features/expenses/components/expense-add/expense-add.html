<div class="modal-overlay" (click)="close()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Nuevo Gasto</h2>
      <button class="modal-close" type="button" (click)="close()">X</button>
    </div>

    <p class="modal-message">{{ message }}</p>

    <form class="modal-form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="description">Descripcion</label>
        <input
          id="description"
          type="text"
          [(ngModel)]="newExpense.description"
          name="description"
          placeholder="Ej: Supermercado Carrefour"
          required
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="amount">Monto</label>
          <input
            id="amount"
            type="number"
            [(ngModel)]="newExpense.amount"
            name="amount"
            placeholder="0.00"
            min="0"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="date">Fecha</label>
          <input id="date" type="date" [(ngModel)]="newExpense.date" name="date" required />
        </div>
      </div>

      <div class="form-group">
        <label for="category">Categoria</label>
        <select id="category" [(ngModel)]="newExpense.category" name="category">
          <option [ngValue]="ExpenseCategory.Housing">Vivienda</option>
          <option [ngValue]="ExpenseCategory.Food">Alimentacion</option>
          <option [ngValue]="ExpenseCategory.Entertainment">Entretenimiento</option>
          <option [ngValue]="ExpenseCategory.Health">Salud</option>
          <option [ngValue]="ExpenseCategory.Transport">Transporte</option>
          <option [ngValue]="ExpenseCategory.Others">Otros</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
